services:
  web:
    build: .
    image: dosar-radar:latest
    container_name: dosar-radar
    ports:
      # Типово слухаємо лише локальний інтерфейс: назовні застосунок має
      # дивитись через реверс-проксі, а не голим портом. BIND=0.0.0.0 —
      # свідомий вибір, а не значення за замовчуванням.
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - data:/data
    environment:
      CETATENIE_DB: /data/data.sqlite3
      # Для погодженого egress-proxy або IP, внесеного власником джерела в allowlist.
      CETATENIE_PROXY_URL: ${CETATENIE_PROXY_URL:-}
      SYNC_RETRY_MINUTES: ${SYNC_RETRY_MINUTES:-5}
      SYNC_RETRY_MAX_MINUTES: ${SYNC_RETRY_MAX_MINUTES:-360}
    restart: unless-stopped

volumes:
  data:
