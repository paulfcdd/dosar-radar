services:
  web:
    build: .
    image: dosar-radar:latest
    container_name: dosar-radar
    ports:
      # Типово слухаємо лише локальний інтерфейс: назовні застосунок має
      # дивитись через реверс-проксі, а не голим портом. BIND=0.0.0.0 —
      # свідомий вибір, а не значення за замовчуванням.
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - data:/data
    environment:
      CETATENIE_DB: /data/data.sqlite3
    restart: unless-stopped

volumes:
  data:
